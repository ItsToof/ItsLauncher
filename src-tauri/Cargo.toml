[package]
name = "itslauncher"
version = "1.0.0"
description = "Minecraft launcher"
edition = "2024"

[lib]
name = "itslauncher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.5", features = ["json", "stream"] }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "fs", "io-util", "process", "time", "sync"] }
futures-util = "0.3.34"
sha1 = "0.11.0"
zip = "9.0.3"
dirs = "7.0.0"
md5 = "0.7"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
